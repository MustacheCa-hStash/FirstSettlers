<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1050" viewBox="0 0 1160 1050"><rect width="1160" height="1050" fill="#f4f1e9"/><style>text{font-family:Arial,sans-serif;fill:#282b27}.label{font-size:18px;font-weight:bold}.small{font-size:15px}.area{stroke:#f4f1e9;stroke-width:4}</style><text x="30" y="40" font-size="28" font-weight="bold">ORDINARY WOOD · TRIM ATLAS LAYOUT</text><text x="30" y="68" class="small">Separate UV guide. Grain runs horizontally; rotate UV islands for vertical planks.</text>
<g transform="translate(30 95)"><rect class="area" x="0" y="0" width="760" height="95" fill="#bc966d"/><text x="20" y="40" class="label">A · RIVEN GRAIN</text><text x="20" y="67" class="small">U 0–1 · V 0.875–1 · 4 m length repeat</text>
<rect class="area" x="0" y="95" width="760" height="95" fill="#a98360"/><text x="20" y="135" class="label">B · ALTERNATE RIVEN GRAIN</text><text x="20" y="162" class="small">U 0–1 · V 0.750–0.875</text>
<rect class="area" x="0" y="190" width="760" height="95" fill="#b28a62"/><text x="20" y="230" class="label">C · HEWN TIMBER / RAILS</text><text x="20" y="257" class="small">U 0–1 · V 0.625–0.750</text>
<rect class="area" x="0" y="285" width="760" height="95" fill="#a08265"/><text x="20" y="325" class="label">D · POLE / BARK</text><text x="20" y="352" class="small">U 0–1 · V 0.500–0.625</text>
<rect class="area" x="0" y="380" width="190" height="190" fill="#c3a17b"/><text x="14" y="425" class="label">E · END GRAIN 1</text><text x="14" y="455" class="small">U 0–0.25</text><text x="14" y="480" class="small">V 0.25–0.50</text>
<rect class="area" x="190" y="380" width="190" height="190" fill="#ba9773"/><text x="204" y="425" class="label">F · END GRAIN 2</text><text x="204" y="455" class="small">U 0.25–0.50</text><text x="204" y="480" class="small">V 0.25–0.50</text>
<rect class="area" x="0" y="570" width="380" height="95" fill="#baa486"/><text x="20" y="610" class="label">G · FIBRE LASHING</text><text x="20" y="637" class="small">U 0–0.50 · V 0.125–0.25</text>
<rect class="area" x="0" y="665" width="380" height="95" fill="#b6936a"/><text x="20" y="705" class="label">H · PEG / TIGHT GRAIN</text><text x="20" y="732" class="small">U 0–0.50 · V 0–0.125</text>
<rect class="area" x="380" y="380" width="380" height="380" fill="#b4c0aa"/><text x="407" y="440" class="label">I · WATTLE + ALPHA HOLES</text><text x="407" y="480" class="small">U 0.50–1 · V 0–0.50</text><text x="407" y="515" class="small">Nominal 2 × 2 m patch</text><text x="407" y="550" class="small">Repeat inside this patch</text><text x="407" y="585" class="small">using separate UV sections.</text><text x="407" y="635" class="small">One cutout material also covers</text><text x="407" y="662" class="small">rails mapped to solid strips.</text>
</g><text x="820" y="130" class="label">UV ORIGIN</text><text x="820" y="163" class="small">Bottom left: U=0, V=0.</text><text x="820" y="205" class="label">WOOD</text><text x="820" y="237" class="small">Repeat along grain only.</text><text x="820" y="268" class="small">Keep V within chosen strip.</text><text x="820" y="310" class="label">CAPS</text><text x="820" y="342" class="small">Use inset isolated islands.</text><text x="820" y="385" class="label">WATTLE</text><text x="820" y="417" class="small">Global Repeat repeats</text><text x="820" y="442" class="small">the entire atlas, not I.</text><text x="820" y="485" class="label">GEOMETRY</text><text x="820" y="517" class="small">Plank tops are modeled.</text><text x="820" y="548" class="small">Rails inset into one face.</text><text x="820" y="579" class="small">Weave stays a cutout sheet.</text><text x="820" y="625" class="label">SAMPLING</text><text x="820" y="657" class="small">Sample inside boundaries.</text><text x="820" y="688" class="small">Allow filtering gutters.</text><text x="30" y="900" class="label">4 m grain scale: 2.75 m plank → 0.6875 U length; 3.50 m rail → 0.875 U length.</text><text x="30" y="942" class="small">A 3.50 × 2.75 m weave at 2 m scale can use four UV sections (2 + 1.5 m wide; 2 + 0.75 m tall).</text><text x="30" y="978" class="small">This layout guide is a diagram, not a texture. Coordinates are the design regions before sampling insets.</text></svg>
