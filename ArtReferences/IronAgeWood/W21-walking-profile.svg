<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 750"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse"><path d="M0 0 L7 3.5 L0 7Z" fill="#27363a"/></marker></defs><rect width="1100" height="750" fill="#f6f3eb"/><style>text{font-family:Arial,sans-serif;fill:#263438}.title{font-size:27px;font-weight:bold}.label{font-size:20px}.small{font-size:17px}.dim{stroke:#27363a;stroke-width:1.5;marker-start:url(#arrow);marker-end:url(#arrow)}</style><text x="35" y="42" class="title">W21 · WALKING COLLIDER / SIDE PROFILE</text><text x="35" y="72" class="small">Unity +Z is the run; +Y is height. Width out of the page: 1.25 m.</text><path d="M140 560 L840 110 L940 110 L940 560Z" fill="#c6dce1" stroke="#315d69" stroke-width="4"/><path d="M140 560 L140 503.75 L240 503.75 L240 447.5 L340 447.5 L340 391.25 L440 391.25 L440 335 L540 335 L540 278.75 L640 278.75 L640 222.5 L740 222.5 L740 166.25 L840 166.25 L840 110 L940 110" fill="none" stroke="#9b7650" stroke-width="4" stroke-dasharray="10 5"/><path d="M70 560 H1000" stroke="#52635e" stroke-width="2"/><path d="M940 110 H1040" stroke="#52635e" stroke-width="3"/><path d="M140 606H940" class="dim"/><text x="450" y="638" class="label">2.00 m total run</text><path d="M990 560V110" class="dim"/><text x="1002" y="315" class="label">1.50 m</text><path d="M140 584H840" class="dim"/><text x="365" y="576" class="small">1.75 m incline ≈ 40.6°</text><path d="M840 98H940" class="dim"/><text x="802" y="92" class="small">0.25 m flat exit</text><text x="105" y="675" class="small">Toe at Y=0: no vertical leading lip.</text><text x="535" y="315" class="label">Solid convex walking hull</text><text x="535" y="344" class="small">8 vertices / 12 triangles</text><text x="75" y="720" class="small">Dashed brown: visual treads. Blue: physics surface. Separate assets; full placement envelope retained.</text></svg>
