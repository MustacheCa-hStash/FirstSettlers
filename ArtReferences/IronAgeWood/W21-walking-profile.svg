<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 750"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse"><path d="M0 0 L7 3.5 L0 7Z" fill="#27363a"/></marker></defs><rect width="1100" height="750" fill="#f6f3eb"/><style>text{font-family:Arial,sans-serif;fill:#263438}.title{font-size:27px;font-weight:bold}.label{font-size:20px}.small{font-size:17px}.dim{stroke:#27363a;stroke-width:1.5;marker-start:url(#arrow);marker-end:url(#arrow)}</style><text x="35" y="42" class="title">W21 · CONTINUOUS WALKING COLLIDER</text><text x="35" y="72" class="small">Unity +Z is the run; +Y is height. Width out of the page: 1.25 m.</text><path d="M140 560L940 110L940 560Z" fill="#c6dce1" stroke="#315d69" stroke-width="4"/><path d="M140 560L140 503.75H240V447.5H340V391.25H440V335H540V278.75H640V222.5H740V166.25H840V110H940" fill="none" stroke="#9b7650" stroke-width="4" stroke-dasharray="10 5"/><path d="M70 560H1030" stroke="#52635e" stroke-width="2"/><path d="M940 110L1030 59.375" stroke="#315d69" stroke-width="4"/><text x="715" y="94" class="small">Next flight continues the same slope.</text><path d="M140 610H940" class="dim"/><text x="440" y="642" class="label">2.00 m run, no flat shelf</text><path d="M995 560V110" class="dim"/><text x="1003" y="320" class="label">1.50 m</text><text x="505" y="365" class="label">36.9° continuous incline</text><text x="505" y="397" class="small">6 vertices / 8 triangles</text><text x="105" y="683" class="small">Zero-height toe; a separate floor/landing provides a flat exit when wanted.</text><text x="65" y="721" class="small">Dashed brown: visual treads. Blue: independent walking hull. Full placement envelope retained.</text></svg>
