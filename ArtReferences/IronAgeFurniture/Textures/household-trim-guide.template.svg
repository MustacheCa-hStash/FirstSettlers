<text x="1172" y="143" class="label">REGIONS / FURNISHING USE</text>
<text x="1172" y="185" class="label">A — Closed willow weave</text><text x="1172" y="209" class="note">F08–F10 basket bodies and lids</text>
<text x="1172" y="255" class="label">B — Bound rush</text><text x="1172" y="279" class="note">F11 rush mat</text>
<text x="1172" y="325" class="label">C — Oatmeal wool</text><text x="1172" y="349" class="note">F12/F22 plain textile; F21 close crop on wool geometry</text>
<text x="1172" y="395" class="label">D — Buff clay</text><text x="1172" y="419" class="note">F13–F15 pottery; F21 whorl</text>
<text x="1172" y="465" class="label">E — Striped wool border</text><text x="1172" y="489" class="note">F12 cover edges; F22 cloth stripes</text>
<text x="1172" y="535" class="label">F — Bound willow rim</text><text x="1172" y="559" class="note">F08–F10 rim/handle wrapping</text>
<text x="1172" y="605" class="label">G — Incised clay band</text><text x="1172" y="629" class="note">F13 jar shoulder; optional F15 rim</text>
<text x="1172" y="675" class="label">H — Bone</text><text x="1172" y="699" class="note">F23 weaving comb</text>
<text x="1172" y="745" class="label">I — Smoke-darkened clay</text><text x="1172" y="769" class="note">F14 lower body and inner cavity</text>
<text x="1172" y="815" class="label">J — Cold ash / packed clay</text><text x="1172" y="839" class="note">F19 hearth centre</text>
<text x="1172" y="885" class="label">K — Dusty sage</text><text x="1172" y="909" class="note">F24 small modeled herb leaves</text>
